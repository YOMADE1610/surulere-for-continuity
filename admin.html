<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Volunteer Administration | Surulere for Continuity</title>
<style>
:root{color-scheme:dark;--navy:#0b2038;--panel:#102b49;--green:#10b981;--gold:#c8ad70;--muted:#b9c8d8}*{box-sizing:border-box}body{margin:0;background:#071729;color:#f5f7fa;font:15px system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:32px auto;padding:18px}.head{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:22px}.brand{font-weight:800;letter-spacing:.04em}.brand span{color:#38d6a0}.panel{background:var(--panel);border:1px solid #bda66d;border-radius:18px;padding:22px;box-shadow:0 18px 50px #0005}.login{max-width:430px;margin:9vh auto}.muted{color:var(--muted)}input{width:100%;padding:13px 14px;border-radius:10px;border:1px solid #55708b;background:#081b30;color:white;margin:8px 0 14px;font-size:16px}button,.btn{border:0;border-radius:9px;padding:12px 16px;background:var(--green);color:#04251c;font-weight:750;cursor:pointer;text-decoration:none;display:inline-block}button.secondary{background:#183a5d;color:white;border:1px solid #55708b}.actions{display:flex;gap:10px;flex-wrap:wrap}.stats{display:flex;gap:14px;flex-wrap:wrap;margin:18px 0}.stat{background:#0a2037;border:1px solid #35516c;padding:15px 18px;border-radius:12px;min-width:145px}.stat strong{font-size:27px;display:block;color:#39d9a2}table{width:100%;border-collapse:collapse;min-width:760px}th,td{text-align:left;padding:12px;border-bottom:1px solid #35516c;vertical-align:top}th{color:#e7d5a8}td{overflow-wrap:anywhere}.table-wrap{overflow:auto;margin-top:16px}.error{color:#ffb4a9;min-height:24px}.hidden{display:none!important}.small{font-size:13px}@media(max-width:600px){.wrap{padding:12px;margin:12px auto}.panel{padding:16px}.head{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="wrap"><header class="head"><div class="brand">SURULERE FOR <span>CONTINUITY</span><div class="muted small">Volunteer administration</div></div><a class="btn secondary" href="/">View website</a></header>
<section id="login" class="panel login"><h1>Administrator sign in</h1><p class="muted">Authorised campaign team members only.</p><form id="loginForm"><label for="password">Administrator password</label><input id="password" type="password" autocomplete="current-password" required><button type="submit">Sign in</button></form><p id="loginError" class="error" role="alert"></p></section>
<section id="dashboard" class="hidden"><div class="panel"><div class="head"><div><h1>Volunteer register</h1><p class="muted">Search, review and export saved registrations.</p></div><div class="actions"><button id="export" class="secondary">Export CSV</button><button id="logout" class="secondary">Sign out</button></div></div>
<div class="stats"><div class="stat"><strong id="total">0</strong><span class="muted small">Total registrations</span></div><div class="stat"><strong id="shown">0</strong><span class="muted small">Records shown</span></div></div>
<label for="search">Search name, registration number, phone, email or ward</label><input id="search" type="search" placeholder="Start typing to filter the register"><p id="status" class="muted small" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>Registration No.</th><th>Name</th><th>Phone</th><th>Email</th><th>Ward</th><th>Date registered</th></tr></thead><tbody id="rows"></tbody></table></div></div></section>
</main><script>
const $=id=>document.getElementById(id);let searchTimer;
function showDashboard(){ $("login").classList.add("hidden");$("dashboard").classList.remove("hidden");load();}
async function load(){ $("status").textContent="Loading register…";try{const q=$("search").value.trim();const r=await fetch("/api/admin/volunteers?q="+encodeURIComponent(q),{cache:"no-store"});const j=await r.json();if(!r.ok){if(r.status===401){$("dashboard").classList.add("hidden");$("login").classList.remove("hidden");}throw new Error(j.error||"Unable to load register");}$("total").textContent=j.total;$("shown").textContent=j.count;$("rows").replaceChildren();for(const v of j.volunteers){const tr=document.createElement("tr");const vals=[v.registration_number,[v.first_name,v.last_name].filter(Boolean).join(" "),v.phone,v.email,v.ward||"—",new Date(v.created_at).toLocaleString()];for(const val of vals){const td=document.createElement("td");td.textContent=val;tr.append(td);}$("rows").append(tr);} $("status").textContent=j.count+" record(s) displayed.";}catch(e){$("status").textContent=e.message;}}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginError").textContent="";try{const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:$("password").value})});const j=await r.json();if(!r.ok)throw new Error(j.error||"Sign in failed");$("password").value="";showDashboard();}catch(e){$("loginError").textContent=e.message;}});
$("search").addEventListener("input",()=>{clearTimeout(searchTimer);searchTimer=setTimeout(load,250);});
$("export").addEventListener("click",()=>{window.location.href="/api/admin/volunteers?format=csv&q="+encodeURIComponent($("search").value.trim());});
$("logout").addEventListener("click",async()=>{await fetch("/api/admin/logout",{method:"POST"});$("dashboard").classList.add("hidden");$("login").classList.remove("hidden");});
fetch("/api/admin/volunteers",{cache:"no-store"}).then(r=>{if(r.ok)showDashboard();}).catch(()=>{});
</script></body></html>
